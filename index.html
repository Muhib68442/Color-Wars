<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#333333" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Color Wars: a local chain reaction game for one to four players on a 7 by 7 to 15 by 15 board."
    />
    <title>Color Wars</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var raw = localStorage.getItem("color-wars:settings");
          var saved = raw ? JSON.parse(raw) : null;
          var theme = saved && saved.settings ? saved.settings.theme : null;
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0f1115");
          }
        } catch (error) {
          // Storage can be unavailable; the app falls back to the light theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Color Wars needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
