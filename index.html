<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Wars | 2 Player Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Color Wars</h1>
        <div class="links">
            <a href="#" target="_blank">*</a>
        </div>
    </header>

    <section class="player-progress">

        <div class="player player1c">
            <div class="p1p">
                <h3>Player 1</h3>
                <progress value="0" max="49"></progress>
            </div>
        </div>

        <div class="player player2c">
            <div class="p2p">
                <h3>Player 2</h3>
                <progress value="0" max="49"></progress>
            </div>
        </div>

    </section>
    
    <div id="turn">Player 1's Turn</div>

    <main>
        <div id="game-board"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
